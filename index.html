<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>商圏マッピング — MYGOL</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/maplibre-gl@5.24.0/dist/maplibre-gl.css">
<script src="https://cdn.jsdelivr.net/npm/maplibre-gl@5.24.0/dist/maplibre-gl.js"></script>
<script src="https://cdn.jsdelivr.net/npm/pmtiles@4.5.0/dist/pmtiles.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@maplibre/maplibre-gl-leaflet@0.1.4/leaflet-maplibre-gl.js"></script>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;600;700&display=swap">
<style>
/* Design tokens */
:root{
  --ocean:#C8DDEF;
  --land:#EEF2F7;
  --land-stroke:#9BB5C8;
  --bg:#F1F5F9;
  --surface:#FFFFFF;
  --surface2:#F8FAFC;
  --border:#E2E8F0;
  --text:#0F172A;
  --text2:#475569;
  --text3:#94A3B8;
  --fit:#059669;
  --range:#2563EB;
  --event:#DC2626;
  --restr:#D97706;
  --shadow:0 1px 3px rgba(0,0,0,.1),0 4px 12px rgba(0,0,0,.06);
}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){
  --ocean:#162032;--land:#1E2D3D;--land-stroke:#2D4A60;
  --bg:#0F172A;--surface:#1E293B;--surface2:#263244;--border:#334155;
  --text:#F1F5F9;--text2:#94A3B8;--text3:#475569;
  --fit:#10B981;--range:#3B82F6;--shadow:0 1px 3px rgba(0,0,0,.4),0 4px 12px rgba(0,0,0,.3);
}}
:root[data-theme=dark]{--ocean:#162032;--land:#1E2D3D;--land-stroke:#2D4A60;--bg:#0F172A;--surface:#1E293B;--surface2:#263244;--border:#334155;--text:#F1F5F9;--text2:#94A3B8;--text3:#475569;--fit:#10B981;--range:#3B82F6;--shadow:0 1px 3px rgba(0,0,0,.4),0 4px 12px rgba(0,0,0,.3)}

*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:"Noto Sans JP",system-ui,sans-serif;font-size:14px;color:var(--text);background:var(--bg);overflow:hidden}

/* Layout - fixed to viewport, reliable in iframe */
#app{position:fixed;inset:0;display:flex;overflow:hidden}

/* Sidebar */
#sb{width:300px;min-width:300px;display:flex;flex-direction:column;background:var(--surface);border-right:1px solid var(--border);z-index:20;overflow:hidden}

/* Map */
#mw{flex:1;position:relative;overflow:hidden;background:var(--ocean);isolation:isolate}
#map{position:absolute;inset:0;background:var(--ocean);font-family:inherit}
.leaflet-tooltip{font-family:inherit;font-size:11px;font-weight:600}
.leaflet-control-layers{font-family:inherit;font-size:11px}
.mk-wrap{background:none;border:none}
.mk{width:100%;height:100%;border:2px solid #fff;box-shadow:0 1px 4px rgba(0,0,0,.45)}
.mk.dot{border-radius:50%}
.mk.dia{transform:rotate(45deg) scale(.85)}
.mk.sel{box-shadow:0 0 0 4px color-mix(in srgb,var(--c) 35%,transparent),0 2px 8px rgba(0,0,0,.5)}
.gm-links{display:flex;flex-wrap:wrap;gap:5px;margin-top:5px}
.gm-links a{font-size:10px;font-weight:500;color:var(--range);text-decoration:none;padding:3px 8px;border:1px solid var(--border);border-radius:99px;background:var(--surface2)}
.gm-links a:hover{background:var(--border)}

/* Sidebar sections */
.sb-top{padding:12px 14px 10px;border-bottom:1px solid var(--border)}
.sb-title{font-size:14px;font-weight:700;letter-spacing:-.01em;color:var(--text)}
.sb-sub{font-size:10px;color:var(--text3);margin-top:2px}

/* Auth */
.auth-row{display:flex;align-items:center;gap:6px;margin-top:6px}
.auth-who{flex:1;min-width:0;font-size:10px;color:var(--text2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.auth-btn{padding:3px 8px;font-size:10px}

/* Toggle */
.toggle-row{display:flex;align-items:center;gap:8px;padding:7px 12px;border-bottom:1px solid var(--border);background:var(--surface2)}
.toggle-row label{font-size:11px;font-weight:600;color:var(--text2);flex:1}
.toggle-pill{position:relative;width:38px;height:22px;cursor:pointer;flex-shrink:0}
.toggle-pill input{opacity:0;width:0;height:0;position:absolute}
.toggle-track{position:absolute;inset:0;background:var(--border);border-radius:999px;transition:background .2s ease}
.toggle-pill input:checked+.toggle-track{background:var(--range)}
.toggle-thumb{position:absolute;top:2px;left:2px;width:18px;height:18px;background:#fff;border-radius:50%;transition:left .2s ease;box-shadow:0 1px 2px rgba(0,0,0,.2),0 1px 1px rgba(0,0,0,.08)}
.toggle-pill input:checked~.toggle-thumb{left:calc(100% - 20px)}

/* Stats */
.stats{display:grid;grid-template-columns:repeat(4,1fr);border-bottom:1px solid var(--border)}
.stat{padding:8px 4px;text-align:center}
.stat-n{font-size:20px;font-weight:700;line-height:1;font-variant-numeric:tabular-nums}
.stat-l{font-size:8px;color:var(--text3);margin-top:2px;letter-spacing:.02em;line-height:1.25}
.s-f .stat-n{color:var(--fit)}.s-r .stat-n{color:var(--range)}.s-e .stat-n{color:var(--event)}.s-re .stat-n{color:var(--restr)}

/* Legend */
.legend{display:flex;flex-wrap:wrap;gap:6px 10px;padding:6px 12px;border-bottom:1px solid var(--border);background:var(--surface2)}
.leg{display:inline-flex;align-items:center;gap:4px;font-size:9px;color:var(--text2)}
.leg-c{width:8px;height:8px;border-radius:50%;border:1.5px solid rgba(255,255,255,.7);box-shadow:0 1px 3px rgba(0,0,0,.3)}
.leg-d{width:8px;height:8px;transform:rotate(45deg);border:1.5px solid rgba(255,255,255,.7);box-shadow:0 1px 3px rgba(0,0,0,.3)}

/* Event date row */
.ev-date-row{display:flex;align-items:center;gap:6px;margin-bottom:6px}
.ev-date-row label{font-size:10px;color:var(--text2);white-space:nowrap}
.ev-date-in{flex:1;padding:5px 7px;border-radius:6px;border:1px solid var(--border);background:var(--surface2);font-family:inherit;font-size:11px;color:var(--text);outline:none}
.ev-date-in:focus{border-color:var(--range)}

/* Controls */
.ctrls{display:flex;gap:6px;padding:7px 10px;border-bottom:1px solid var(--border)}
.btn{display:inline-flex;align-items:center;gap:4px;padding:5px 9px;border-radius:6px;border:1px solid var(--border);background:var(--surface2);font-family:inherit;font-size:10px;font-weight:500;cursor:pointer;color:var(--text);white-space:nowrap;transition:all .15s}
.btn:hover{background:var(--border)}
.btn.active{background:var(--range);color:#fff;border-color:var(--range)}

/* Search */
.search-wrap{padding:6px 10px;border-bottom:1px solid var(--border);background:var(--surface)}
.search-inp{width:100%;padding:6px 10px 6px 30px;border-radius:7px;border:1px solid var(--border);background:var(--surface2);font-family:inherit;font-size:12px;color:var(--text);outline:none;transition:border .15s}
.search-inp:focus{border-color:var(--range)}
.search-wrap{position:relative}
.search-ico{position:absolute;left:18px;top:50%;transform:translateY(-50%);font-size:13px;color:var(--text3);pointer-events:none}

/* Status filter chips */
.filter-row{display:flex;gap:4px;padding:5px 10px 6px;border-bottom:1px solid var(--border);background:var(--surface);flex-wrap:wrap}
.fchip{padding:3px 9px;border-radius:99px;border:1.5px solid var(--border);font-family:inherit;font-size:9px;font-weight:700;cursor:pointer;background:var(--surface2);color:var(--text2);transition:all .15s;letter-spacing:.02em}
.fchip:hover{background:var(--border)}
.fchip.active{color:#fff;border-color:transparent}
.fc-all.active{background:var(--text2)}
.fc-ok.active{background:var(--fit)}
.fc-ev.active{background:var(--event)}
.fc-re.active{background:var(--restr)}

/* Store list */
.list-hd{padding:4px 12px 2px;font-size:9px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--text3)}
#list{flex:1;overflow-y:auto;padding:3px 5px 8px}
#list::-webkit-scrollbar{width:3px}#list::-webkit-scrollbar-thumb{background:var(--border);border-radius:2px}

.si{display:flex;align-items:center;gap:7px;padding:6px 7px;border-radius:7px;cursor:pointer;transition:background .12s;margin-bottom:1px;user-select:none}
.si:hover{background:var(--surface2)}.si.sel{background:rgba(37,99,235,.08)}
.si-mk{width:11px;height:11px;flex-shrink:0;border:2px solid rgba(255,255,255,.7);box-shadow:0 1px 4px rgba(0,0,0,.35)}
.si-mk.dot{border-radius:50%}.si-mk.dia{transform:rotate(45deg)}
.si-body{flex:1;min-width:0}
.si-nm{font-size:11px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.4}
.si-mt{font-size:9px;color:var(--text3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.3;margin-top:1px}
.si-r{display:flex;align-items:center;gap:4px;flex-shrink:0}
.si-km{font-size:9px;color:var(--text3)}

/* Event button */
.ev{padding:3px 7px;border-radius:4px;border:none;font-family:inherit;font-size:9px;font-weight:600;cursor:pointer;min-width:44px;text-align:center;transition:opacity .15s}
.ev:hover{opacity:.75}
.ev.rec{background:rgba(5,150,105,.1);color:var(--fit)}
.ev.can{background:rgba(220,38,38,.1);color:var(--event)}
.ev.lock{background:rgba(217,119,6,.08);color:var(--restr);cursor:not-allowed;opacity:.7}
.ev.na{background:var(--surface2);color:var(--text3);cursor:default}

/* Detail panel */
#detail{position:absolute;top:10px;right:10px;width:270px;background:var(--surface);border-radius:12px;box-shadow:var(--shadow),0 0 0 1px var(--border);z-index:900;display:none;max-height:calc(100% - 20px);overflow-y:auto}
#detail.open{display:block}
#detail::-webkit-scrollbar{width:3px}#detail::-webkit-scrollbar-thumb{background:var(--border);border-radius:2px}
.dh{display:flex;align-items:flex-start;justify-content:space-between;gap:8px;padding:12px 12px 8px}
.dh-i{flex:1}
.dh-nm{font-size:13px;font-weight:700;line-height:1.3}
.dh-chips{display:flex;flex-wrap:wrap;gap:4px;margin-top:4px}
.chip{padding:2px 7px;border-radius:99px;font-size:9px;font-weight:600}
.chip-f{background:rgba(5,150,105,.1);color:var(--fit)}
.chip-r{background:rgba(37,99,235,.1);color:var(--range)}
.chip-ev{background:rgba(220,38,38,.1);color:var(--event)}
.chip-re{background:rgba(217,119,6,.1);color:var(--restr)}
.chip-ok{background:rgba(5,150,105,.1);color:var(--fit)}
.chip-ng{background:var(--surface2);color:var(--text3)}
.dh-x{background:none;border:none;cursor:pointer;color:var(--text3);font-size:18px;line-height:1;padding:0;flex-shrink:0;margin-top:-2px}
.dh-x:hover{color:var(--text)}
.db{padding:0 12px 8px;border-top:1px solid var(--border)}
.dl{font-size:8px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--text3);margin-top:8px;margin-bottom:2px}
.dv{font-size:11px;color:var(--text);line-height:1.55}
.info-box{border-radius:7px;padding:8px 9px;font-size:10px;line-height:1.7;margin:6px 0}
.ib-ev{background:rgba(220,38,38,.06);border:1px solid rgba(220,38,38,.18);color:var(--event)}
.ib-re{background:rgba(217,119,6,.06);border:1px solid rgba(217,119,6,.18);color:var(--restr)}
.r-row{display:flex;align-items:center;gap:5px;margin-top:3px}
.r-in{width:56px;padding:4px 5px;border-radius:5px;border:1px solid var(--border);font-family:inherit;font-size:11px;background:var(--surface2);color:var(--text)}
.r-in:focus{outline:2px solid var(--range);border-color:transparent}
.da{padding:0 12px 12px}
.btn-prim{background:var(--fit);color:#fff;border-color:var(--fit);width:100%;justify-content:center;font-size:11px;padding:7px}
.btn-prim:hover{background:#047857}
.btn-dng{background:var(--event);color:#fff;border-color:var(--event);width:100%;justify-content:center;font-size:11px;padding:7px}
.btn-dng:hover{background:#b91c1c}
.btn-sec{background:var(--surface2);color:var(--text2);border-color:var(--border)}
.btn-sec:hover{background:var(--border)}

/* Add-store modal */
.modal-ov{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:2000;display:flex;align-items:center;justify-content:center;padding:16px}
.modal-ov.hidden{display:none}
.modal{background:var(--surface);border-radius:14px;padding:20px;width:320px;max-width:100%;box-shadow:0 20px 60px rgba(0,0,0,.3);max-height:calc(100vh - 40px);overflow-y:auto}
.modal-hd{font-size:14px;font-weight:700;margin-bottom:14px;display:flex;align-items:center;justify-content:space-between}
.modal-x{background:none;border:none;cursor:pointer;color:var(--text3);font-size:20px;line-height:1;padding:0;flex-shrink:0}
.modal-x:hover{color:var(--text)}
.f-row{margin-bottom:10px}
.f-row-2{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px}
.f-lbl{display:block;font-size:9px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--text3);margin-bottom:3px}
.f-inp,.f-sel{width:100%;padding:7px 9px;border-radius:7px;border:1px solid var(--border);background:var(--surface2);font-family:inherit;font-size:12px;color:var(--text);outline:none}
.f-inp:focus,.f-sel:focus{border-color:var(--range)}
.f-hint{font-size:9px;color:var(--text3);margin-top:3px}
.modal-ftr{display:flex;gap:8px;margin-top:14px}
.modal-ftr .btn{flex:1;justify-content:center;padding:8px;font-size:11px}

/* Edit-address inline form */
.ea-form{background:var(--surface2);border-radius:8px;padding:10px;margin-top:8px;border:1px solid var(--border)}
.ea-form .f-row{margin-bottom:8px}
.ea-form .f-row:last-of-type{margin-bottom:0}
.ea-form .f-inp{font-size:11px;padding:5px 8px}
.ea-form .f-row-2{margin-bottom:8px}
.ea-toggle{display:inline-flex;align-items:center;gap:4px;font-size:10px;color:var(--text2);background:none;border:none;cursor:pointer;padding:2px 0;font-family:inherit;font-weight:500}
.ea-toggle:hover{color:var(--range)}

/* Map controls overlay */
#map-btns{position:absolute;bottom:16px;right:12px;z-index:800;display:flex;flex-direction:column;gap:5px}
.m-btn{background:var(--surface);border:1px solid var(--border);border-radius:7px;padding:6px 10px;font-family:inherit;font-size:10px;font-weight:500;cursor:pointer;color:var(--text);box-shadow:var(--shadow);white-space:nowrap}
.m-btn:hover{background:var(--surface2)}
.m-btn.on{background:var(--range);color:#fff;border-color:var(--range)}
#zoom-btns{position:absolute;bottom:40px;left:12px;z-index:800;display:flex;flex-direction:column;gap:3px}
.z-btn{background:var(--surface);border:1px solid var(--border);border-radius:6px;width:30px;height:30px;font-family:inherit;font-size:16px;font-weight:700;cursor:pointer;color:var(--text);box-shadow:var(--shadow);display:flex;align-items:center;justify-content:center;line-height:1}
.z-btn:hover{background:var(--surface2)}


/* Toast */
#toast{position:fixed;bottom:16px;left:50%;transform:translateX(-50%) translateY(20px);background:rgba(15,23,42,.92);backdrop-filter:blur(8px);color:#fff;padding:8px 16px;border-radius:8px;font-size:11px;z-index:9999;opacity:0;transition:all .22s;white-space:nowrap;pointer-events:none}
#toast.on{opacity:1;transform:translateX(-50%)}

@media(max-width:600px){
  #app{flex-direction:column}
  #sb{width:100%;min-width:0;max-height:44vh}
  #mw{flex:1}
  #detail{width:calc(100% - 16px);top:6px;right:8px}
}
</style>
</head>
<body>

<div id="app">
<aside id="sb">
  <div class="sb-top">
    <div class="sb-title">🗾 商圏マッピング</div>
    <div class="sb-sub">MYGOL グループ 全国97店舗</div>
    <div class="auth-row">
      <span class="auth-who" id="auth-who">閲覧モード</span>
      <button class="btn auth-btn" id="auth-btn" onclick="onAuthBtn()">🔑 編集者ログイン</button>
    </div>
  </div>

  <div class="toggle-row">
    <label for="rng-toggle">MY GOLF RANGE を表示</label>
    <label class="toggle-pill">
      <input type="checkbox" id="rng-toggle" checked onchange="toggleRange(this.checked)">
      <span class="toggle-track"></span>
      <span class="toggle-thumb"></span>
    </label>
  </div>

  <div class="stats">
    <div class="stat s-f"><div class="stat-n" id="c-f">–</div><div class="stat-l">MYGOL/<br>GOLF LANE</div></div>
    <div class="stat s-r"><div class="stat-n" id="c-r">–</div><div class="stat-l">MY GOLF<br>RANGE</div></div>
    <div class="stat s-e"><div class="stat-n" id="c-e">–</div><div class="stat-l">実施済</div></div>
    <div class="stat s-re"><div class="stat-n" id="c-re">–</div><div class="stat-l">制限中</div></div>
  </div>

  <div class="legend">
    <span class="leg"><span class="leg-c" style="background:var(--fit)"></span>MYGOL / GOLF LANE</span>
    <span class="leg"><span class="leg-d" style="background:var(--range)"></span>MY GOLF RANGE</span>
    <span class="leg"><span class="leg-c" style="background:var(--event)"></span>直近実施済</span>
    <span class="leg"><span class="leg-c" style="background:var(--restr)"></span>制限中</span>
  </div>

  <div id="add-btn-row" style="display:none;padding:6px 10px 0;border-top:1px solid var(--border)">
    <button class="btn btn-prim" style="width:100%;justify-content:center;font-size:11px;padding:6px" onclick="showAddModal()">＋ 店舗を追加</button>
  </div>

  <div class="ctrls">
    <button class="btn" id="cb-btn" onclick="toggleCircles()">◎ 商圏を表示</button>
    <button class="btn" onclick="fitAllBtn()">⊕ 全体表示</button>
  </div>

  <div class="search-wrap">
    <span class="search-ico">🔍</span>
    <input class="search-inp" id="search-inp" type="search" placeholder="店舗名で検索..." oninput="onSearch(this.value)">
  </div>

  <div class="filter-row">
    <button class="fchip fc-all active" id="fc-all" onclick="setFilter(null)">すべて</button>
    <button class="fchip fc-ok" id="fc-ok" onclick="setFilter('ok')">✅ 実施可能</button>
    <button class="fchip fc-ev" id="fc-ev" onclick="setFilter('ev')">🔴 実施済</button>
    <button class="fchip fc-re" id="fc-re" onclick="setFilter('re')">⚠ 制限中</button>
  </div>

  <div class="list-hd" id="lh">読み込み中...</div>
  <div id="list"></div>
</aside>

<div id="mw">
  <div id="map"></div>
  <div id="zoom-btns">
    <button class="z-btn" onclick="zoom(1.3)">+</button>
    <button class="z-btn" onclick="zoom(1/1.3)">−</button>
  </div>
  <div id="map-btns">
    <button class="m-btn" id="mb-c" onclick="toggleCircles()">◎ 商圏</button>
  </div>
</div>
</div>

<div id="detail">
  <div class="dh">
    <div class="dh-i">
      <div class="dh-nm" id="d-nm"></div>
      <div class="dh-chips" id="d-chips"></div>
    </div>
    <button class="dh-x" onclick="closeDetail()">×</button>
  </div>
  <div class="db">
    <div id="d-info"></div>
    <div class="dl">ブランド</div><div class="dv" id="d-br"></div>
    <div class="dl">住所</div><div class="dv" id="d-ad"></div>
    <div class="gm-links" id="d-gm"></div>
    <div class="dl">エリア区分</div><div class="dv" id="d-ar"></div>
    <div class="dl">商圏半径</div>
    <div class="r-row">
      <input class="r-in" type="number" id="d-rad" min="0.1" max="50" step="0.1">
      <span style="font-size:11px;color:var(--text3)">km</span>
      <button class="btn" style="font-size:9px;padding:4px 8px" onclick="saveRad()">更新</button>
    </div>
  </div>
  <div class="da" id="d-edit-addr"></div>
  <div class="da" id="d-act"></div>
</div>

<div id="toast"></div>

<!-- Login modal -->
<div class="modal-ov hidden" id="login-modal" onclick="if(event.target===this)hideLogin()">
  <div class="modal">
    <div class="modal-hd">
      <span>🔑 編集者ログイン</span>
      <button class="modal-x" onclick="hideLogin()">×</button>
    </div>
    <div class="f-row">
      <label class="f-lbl">メールアドレス</label>
      <input class="f-inp" id="lg-email" type="email" autocomplete="email" placeholder="you@example.com" onkeydown="if(event.key==='Enter')sendLoginLink()">

/* Helpers */
const hav=(la1,lo1,la2,lo2)=>{const R=6371,r=Math.PI/180,dLa=(la2-la1)*r,dLo=(lo2-lo1)*r,a=Math.sin(dLa/2)**2+Math.cos(la1*r)*Math.cos(la2*r)*Math.sin(dLo/2)**2;return R*2*Math.atan2(Math.sqrt(a),Math.sqrt(1-a))};
const genId=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const addM=(ts,n)=>{const d=new Date(ts);d.setMonth(d.getMonth()+n);return d.getTime()};
const fmt=ts=>{const d=new Date(ts);return`${d.getFullYear()}/${String(d.getMonth()+1).padStart(2,'0')}/${String(d.getDate()).padStart(2,'0')}`};
const todayStr=()=>{const d=new Date();return`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`};
const esc=s=>String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
const isR=b=>b==='MY GOLF RANGE';
const defR=ar=>ar==='市街地'?2:5;

/* State */
let db=null;
const S={};
const E={};
let selId=null, showC=false, showRng=true, searchQ='', filterSt=null;
let isOwner=false;

/* Build stores */
RAW.forEach((r,i)=>{
  const id='s'+String(i).padStart(3,'0');
  const c=COORDS[r.n];
  S[id]={id,n:r.n,b:r.b,z:r.z,a:r.a,ar:r.ar,rad:defR(r.ar),lat:c?c[0]:null,lng:c?c[1]:null};
});

/* Status */
function status(id){
  const now=Date.now(),s=S[id];if(!s)return{st:'ok'};
  for(const ev of Object.values(E)) if(ev.sid===id&&ev.exp>now) return{st:'ev',ev};
  if(s.lat!=null) for(const ev of Object.values(E)){
    if(ev.exp<=now) continue;
    const es=S[ev.sid];if(!es||ev.sid===id||es.lat==null) continue;
    if(hav(s.lat,s.lng,es.lat,es.lng)<(s.rad+es.rad)) return{st:'re',by:es,ev};
  }
  return{st:'ok'};
}
function col(id,st){
  const s=S[id];if(!s)return'#94A3B8';
  if(st==='ev')return'#DC2626';if(st==='re')return'#D97706';
  return isR(s.b)?'#2563EB':'#059669';
}

/* ===== MAP（Leaflet + 国土地理院地図） ===== */
const GSI_ATTR='<a href="https://maps.gsi.go.jp/development/ichiran.html" target="_blank" rel="noopener">国土地理院</a>';
/* シンプル地図：国土地理院ベクトルタイルから「陸・海・海岸線・行政界・都道府県/市区町村名」だけを描画。
   道路・鉄道・建物・地図記号・細かい町名は表示しない */
const C_SEA='#CFE0EE', C_LAND='#F7F6F2';
const ADM_NAMES=[110,120,130,140]; // 注記分類コード：都道府県名・市区町村名
const SIMPLE_STYLE={
  version:8,
  glyphs:'https://gsi-cyberjapan.github.io/optimal_bvmap/glyphs/{fontstack}/{range}.pbf',
  sources:{v:{type:'vector',minzoom:4,maxzoom:16,
    tiles:['pmtiles://https://cyberjapandata.gsi.go.jp/xyz/optimal_bvmap-v1/optimal_bvmap-v1.pmtiles/{z}/{x}/{y}']}},
  layers:[
    // 低ズームでは海を背景色、ズーム8以上では水域ポリゴンで海を塗る（地理院の標準スタイルと同じ構成）
    {id:'bg',type:'background',paint:{'background-color':['step',['zoom'],C_SEA,8,C_LAND]}},
    {id:'land',type:'fill',source:'v','source-layer':'AdmArea',paint:{'fill-color':C_LAND}},
    {id:'water',type:'fill',source:'v','source-layer':'WA',paint:{'fill-color':C_SEA}},
    {id:'coast',type:'line',source:'v','source-layer':'Cstline',paint:{'line-color':'#A9BFD0','line-width':.8}},
    {id:'city-bdry',type:'line',source:'v','source-layer':'AdmBdry',minzoom:9,filter:['==',['get','vt_code'],1212],
      paint:{'line-color':'#DDD8CE','line-width':.8}},
    {id:'pref-bdry',type:'line',source:'v','source-layer':'AdmBdry',filter:['==',['get','vt_code'],1211],
      paint:{'line-color':'#BDB6A8','line-width':['interpolate',['linear'],['zoom'],5,.6,10,1.4]}},
    {id:'adm-names',type:'symbol',source:'v','source-layer':'Anno',
      filter:['all',['==',['geometry-type'],'Point'],['in',['get','vt_code'],['literal',ADM_NAMES]],
        ['step',['zoom'],['any',['!',['has','vt_flag17']],['in',['get','vt_flag17'],['literal',[0,1]]]],
          17,['any',['!',['has','vt_flag17']],['in',['get','vt_flag17'],['literal',[1,2]]]]]],
      layout:{'text-field':['get','vt_text'],'text-font':['literal',['NotoSansJP-Regular']],
        'text-size':['match',['get','vt_code'],110,14,[120,140],12.5,11.5],
        'symbol-sort-key':['match',['get','vt_code'],110,0,[120,140],1,2],'text-padding':6},
      paint:{'text-color':['match',['get','vt_code'],110,'#3F4A5A','#5E6878'],
        'text-halo-color':'rgba(255,255,255,.95)','text-halo-width':1.6}},
  ],
};
const GSI_VT_ATTR='<a href="https://github.com/gsi-cyberjapan/optimal_bvmap" target="_blank" rel="noopener">国土地理院最適化ベクトルタイル</a>';
function simpleLayer(){
  // ベクトル地図が使えない環境（ライブラリ読込失敗・WebGL非対応）では淡色地図で代替
  const c=document.createElement('canvas');
  const gl=c.getContext('webgl2')||c.getContext('webgl');
  if(!gl||!window.maplibregl||!window.pmtiles||!L.maplibreGL) return null;
  try{ maplibregl.addProtocol('pmtiles',new pmtiles.Protocol().tile); }catch(e){}
  const layer=L.maplibreGL({style:SIMPLE_STYLE});
  layer.getAttribution=()=>GSI_VT_ATTR; // 出典表示（国土地理院の利用規約で必須）
  return layer;
}
const paleLayer=L.tileLayer('https://cyberjapandata.gsi.go.jp/xyz/pale/{z}/{x}/{y}.png',{maxNativeZoom:18,maxZoom:20,attribution:GSI_ATTR});
const BASE_LAYERS={
  'シンプル（おすすめ）':simpleLayer()||paleLayer,
  '詳細地図（道路・駅あり）':paleLayer,
  '航空写真':L.tileLayer('https://cyberjapandata.gsi.go.jp/xyz/seamlessphoto/{z}/{x}/{y}.jpg',{maxNativeZoom:18,maxZoom:20,attribution:GSI_ATTR}),
};
if(BASE_LAYERS['シンプル（おすすめ）']===paleLayer) delete BASE_LAYERS['シンプル（おすすめ）'];
const map=L.map('map',{zoomControl:false,minZoom:4,maxZoom:18}).setView([36.5,137.5],5);
// 前回選んだ地図の種類を復元
let baseName=Object.keys(BASE_LAYERS)[0];
try{ const v=localStorage.getItem('mg_base2'); if(v&&BASE_LAYERS[v]) baseName=v; }catch(e){}
BASE_LAYERS[baseName].addTo(map);
map.on('baselayerchange',e=>{ try{localStorage.setItem('mg_base2',e.name);}catch(_){} });
L.control.layers(BASE_LAYERS,null,{position:'topleft'}).addTo(map);
L.control.scale({imperial:false,position:'bottomleft'}).addTo(map);

const circleLayer=L.layerGroup().addTo(map);
const markerLayer=L.layerGroup().addTo(map);
const MK={}; // 店舗ID → マーカー

function mkIcon(s,c,isSel){
  const sz=isSel?18:13;
  return L.divIcon({className:'mk-wrap',iconSize:[sz,sz],iconAnchor:[sz/2,sz/2],
    html:`<div class="mk ${isR(s.b)?'dia':'dot'}${isSel?' sel':''}" style="background:${c};--c:${c}"></div>`});
}

function drawMap(){
  circleLayer.clearLayers();
  const seen=new Set();
  for(const s of Object.values(S)){
    if(s.lat==null||s.lng==null) continue;
    if(isR(s.b)&&!showRng) continue;
    const{st}=status(s.id);
    const c=col(s.id,st);
    const isSel=s.id===selId;
    // 商圏円（実距離 km → m）
    if(showC){
      L.circle([s.lat,s.lng],{radius:(s.rad||defR(s.ar))*1000,interactive:false,
        color:c,weight:1.5,opacity:.7,dashArray:'6 4',fillColor:c,fillOpacity:.08}).addTo(circleLayer);
    }
    const key=`${c}|${isSel}|${s.b}`;
    let m=MK[s.id];
    if(!m){
      const id=s.id;
      m=L.marker([s.lat,s.lng],{icon:mkIcon(s,c,isSel),riseOnHover:true})
        .bindTooltip(()=>esc(S[id]?.n),{direction:'top',offset:[0,-8]})
        .on('click',()=>{ if(selId===id) closeDetail(); else sel(id,false); })
        .addTo(markerLayer);
      MK[id]=m;
    } else {
      m.setLatLng([s.lat,s.lng]);
      if(m._key!==key) m.setIcon(mkIcon(s,c,isSel));
    }
    m._key=key;
    m.setZIndexOffset(isSel?1000:0);
    seen.add(s.id);
  }
  for(const id of Object.keys(MK)) if(!seen.has(id)){ markerLayer.removeLayer(MK[id]); delete MK[id]; }
}

// 全店舗が入るように表示
function fitAll(){
  const pts=Object.values(S).filter(s=>s.lat!=null&&s.lng!=null&&(isR(s.b)?showRng:true)).map(s=>[s.lat,s.lng]);
  if(!pts.length) return;
  map.fitBounds(pts,{padding:[30,30],maxZoom:14});
}
function fitAllBtn(){ fitAll(); }
function zoom(factor){ factor>1?map.zoomIn():map.zoomOut(); }

// 地図の空白部分クリック：住所編集中なら位置を指定、それ以外は詳細を閉じる
map.on('click',e=>{
  const latIn=document.getElementById('ea-lat');
  if(isOwner&&latIn){
    latIn.value=e.latlng.lat.toFixed(6);
    document.getElementById('ea-lng').value=e.latlng.lng.toFixed(6);
    toast('📍 クリックした地点を入力しました（「保存する」で確定）');
    return;
  }
  if(selId) closeDetail();
});

// ===== SIDEBAR =====
function renderList(){
  const el=document.getElementById('list');
  const q=searchQ.toLowerCase();
  const arr=Object.values(S).sort((a,b)=>{
    const ag=isR(a.b)?1:0,bg=isR(b.b)?1:0;
    if(ag!==bg) return ag-bg;
    return a.n.localeCompare(b.n,'ja');
  });
  const vis=arr.filter(s=>{
    if(isR(s.b)&&!showRng) return false;
    if(q&&!s.n.toLowerCase().includes(q)) return false;
    if(filterSt!==null){
      const{st}=status(s.id);
      if(filterSt==='ok'&&!(st==='ok'&&s.lat!=null&&s.a)) return false;
      if(filterSt==='ev'&&st!=='ev') return false;
      if(filterSt==='re'&&st!=='re') return false;
    }
    return true;
  });
  const hdLabel=filterSt==='ok'?'実施可能':filterSt==='ev'?'直近実施済':filterSt==='re'?'制限中':null;
  document.getElementById('lh').textContent=
    hdLabel?`${hdLabel}（${vis.length}件）`:q?`検索結果（${vis.length}件）`:`店舗一覧（${vis.length}件）`;
  const exist={};
  for(const e of el.querySelectorAll('[data-id]')) exist[e.dataset.id]=e;
  const visIds=new Set(vis.map(s=>s.id));
  for(const s of arr){
    const show=visIds.has(s.id);
    const{st,ev,by}=status(s.id);
    const c=col(s.id,st);
    const isRange=isR(s.b);
    let meta='',btnC='',btnT='',btnA=null;
    if(!s.a){meta='住所未登録';btnC='na';btnT='—';}
    else if(s.lat==null){meta='位置情報なし';btnC='na';btnT='—';}
    else if(st==='ev'&&ev){meta=`直近でイベント実施済 〜 復活:${fmt(ev.exp)}`;btnC=isOwner?'can':'na';btnT=isOwner?'取消':'●';btnA=isOwner?()=>cancelEv(s.id):null;}
    else if(st==='re'&&by){meta=`制限中（${by.n}）`;btnC='lock';btnT='制限中';}
    else{meta=s.a;btnC=isOwner?'rec':'na';btnT=isOwner?'記録':'●';btnA=isOwner?()=>recEv(s.id):null;}
    let row=exist[s.id];
    if(!row){
      row=document.createElement('div');row.className='si';row.dataset.id=s.id;
      row.addEventListener('click',()=>sel(s.id));
      el.appendChild(row);
    }
    row.style.display=show?'':'none';
    row.classList.toggle('sel',s.id===selId);
    row.innerHTML=`
      <div class="si-mk ${isRange?'dia':'dot'}" style="background:${c}"></div>
      <div class="si-body">
        <div class="si-nm">${esc(s.n)}</div>
        <div class="si-mt">${esc(meta)}</div>
      </div>
      <div class="si-r">
        <span class="si-km">${s.rad}km</span>
        <button class="ev ${btnC}" data-bid="${s.id}">${btnT}</button>
      </div>`;
    const btn=row.querySelector(`[data-bid="${s.id}"]`);
    if(btnA) btn.addEventListener('click',e=>{e.stopPropagation();btnA();});
    else btn.addEventListener('click',e=>e.stopPropagation());
    delete exist[s.id];
  }
  for(const e of Object.values(exist)) e.remove();
}

function renderStats(){
  let f=0,r=0,ev=0,re=0;
  for(const s of Object.values(S)){
    if(s.lat==null) continue;
    const{st}=status(s.id);
    if(st==='ev') ev++;
    else if(st==='re') re++;
    else if(isR(s.b)) r++;
    else f++;
  }
  document.getElementById('c-f').textContent=f;
  document.getElementById('c-r').textContent=r;
  document.getElementById('c-e').textContent=ev;
  document.getElementById('c-re').textContent=re;
  document.querySelector('.sb-sub').textContent=`MYGOL グループ 全国${Object.keys(S).length}店舗`;
}

function render(){
  drawMap();
  renderList();
  renderStats();
  if(selId) showDetail(selId);
}

/* Select */
function sel(id,pan=true){
  // 別の店舗への切り替え時は編集フォームをリセット
  if(id!==selId){ const ea=document.getElementById('d-edit-addr');ea.innerHTML='';ea.dataset.open='0'; }
  selId=id;
  const s=S[id];
  // 店舗の位置へ移動（周辺の道路・駅が見える縮尺まで拡大）
  if(pan&&s?.lat!=null&&s?.lng!=null) map.flyTo([s.lat,s.lng],Math.max(map.getZoom(),14),{duration:.6});
  render();
}
function closeDetail(){
  selId=null;
  document.getElementById('detail').classList.remove('open');
  const ea=document.getElementById('d-edit-addr');
  ea.innerHTML='';ea.dataset.open='0';
  drawMap();renderList();
}

function showDetail(id){
  const s=S[id];if(!s)return;
  // 別の店舗への切り替え時は編集フォームをリセット
  if(id!==selId){ const ea=document.getElementById('d-edit-addr');ea.innerHTML='';ea.dataset.open='0'; }
  const{st,ev,by}=status(id);
  const rng=isR(s.b);
  document.getElementById('d-nm').textContent=s.n;
  const chips=[`<span class="chip ${rng?'chip-r':'chip-f'}">${rng?'MY GOLF RANGE':'MYGOL/GOLF LANE'}</span>`];
  if(s.lat){
    if(st==='ev') chips.push('<span class="chip chip-ev">直近実施済</span>');
    else if(st==='re') chips.push('<span class="chip chip-re">制限中</span>');
    else chips.push('<span class="chip chip-ok">実施可能</span>');
  } else chips.push('<span class="chip chip-ng">位置未取得</span>');
  document.getElementById('d-chips').innerHTML=chips.join('');
  let info='';
  if(st==='ev'&&ev) info=`<div class="info-box ib-ev">✅ 直近でイベント実施済<br>実施日：${fmt(ev.held)}<br>商圏復活日：${fmt(ev.exp)}</div>`;
  else if(st==='re'&&by) info=`<div class="info-box ib-re">⚠ 商圏重複により実施不可<br>対象：<b>${esc(by.n)}</b><br>解除予定：${fmt(ev.exp)}</div>`;
  document.getElementById('d-info').innerHTML=info;
  document.getElementById('d-br').textContent=s.b;
  document.getElementById('d-ad').textContent=s.a||'住所未登録';
  document.getElementById('d-gm').innerHTML=gmLinks(s);
  document.getElementById('d-ar').textContent=s.ar;
  document.getElementById('d-rad').value=s.rad;
  // 商圏半径の更新ボタン：オーナーのみ表示
  document.getElementById('d-rad').disabled=!isOwner;
  const radBtn=document.querySelector('[onclick="saveRad()"]');
  if(radBtn) radBtn.style.display=isOwner?'':'none';
  // 住所編集セクション
  const ea=document.getElementById('d-edit-addr');
  if(!ea.dataset.open||ea.dataset.open!=='1'){
    ea.innerHTML=isOwner
      ?`<button class="ea-toggle" onclick="toggleEditAddr('${id}')">✏ 住所・位置を編集</button>`
      :'';
    if(ea.dataset.open!=='1') ea.dataset.open='0';
  }
  const act=document.getElementById('d-act');
  if(!isOwner){ act.innerHTML=''; }
  else if(!s.a) act.innerHTML='';
  else if(s.lat==null) act.innerHTML='<div style="font-size:10px;color:var(--text3);text-align:center;padding:4px">住所からの位置情報が登録されていません</div>';
  else if(st==='ev') act.innerHTML=`<button class="btn btn-dng" onclick="cancelEv('${id}')">✕ イベント記録を取り消す</button>`;
  else if(st==='ok') act.innerHTML=`
    <div class="ev-date-row">
      <label>実施日</label>
      <input class="ev-date-in" type="date" id="ev-date-in" value="${todayStr()}">
    </div>
    <button class="btn btn-prim" onclick="recEv('${id}')">🎯 イベント実施を記録する</button>`;
  else act.innerHTML='';
  document.getElementById('detail').classList.add('open');
}

/* Google マップへのリンク */
function gmLinks(s){
  const out=[];
  const q=s.a?`${s.a.split(/\s/)[0]} ${s.b} ${s.n}`:(s.lat!=null?`${s.lat},${s.lng}`:'');
  if(q) out.push(`<a href="https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(q)}" target="_blank" rel="noopener">🗺 Googleマップ</a>`);
  if(s.lat!=null&&s.lng!=null){
    out.push(`<a href="https://www.google.com/maps/@?api=1&map_action=pano&viewpoint=${s.lat},${s.lng}" target="_blank" rel="noopener">👀 ストリートビュー</a>`);
    out.push(`<a href="https://maps.gsi.go.jp/#16/${s.lat}/${s.lng}/" target="_blank" rel="noopener">地理院地図</a>`);
  }
  return out.join('');
}

/* Search */
function onSearch(v){searchQ=v.trim();renderList();}
function setFilter(st){

/* Event CRUD */
async function recEv(id){
  const s=S[id];if(!s||s.lat==null)return;
  // Read date from picker if present, fall back to today
  const inp=document.getElementById('ev-date-in');
  let held=Date.now();
  if(inp&&inp.value){
    const parsed=new Date(inp.value+'T00:00:00');
    if(!isNaN(parsed)) held=parsed.getTime();
  }
  const eid=genId();
  const d={id:eid,sid:id,held,exp:addM(held,3)};
  E[eid]=d;
  if(db) db.doc(`events/${eid}`).set(d).catch(()=>{});else saveL();
  render();toast(`✅ ${s.n} のイベントを記録しました（${fmt(held)}）`);
}
async function cancelEv(id){
  const now=Date.now();
  for(const[eid,ev] of Object.entries(E)) if(ev.sid===id&&ev.exp>now){
    delete E[eid];
    if(db) db.doc(`events/${eid}`).delete().catch(()=>{});else saveL();
    break;
  }
  render();toast('🗑 イベント記録を取り消しました');
}
function saveRad(){
  if(!selId||!isOwner)return;
  const v=parseFloat(document.getElementById('d-rad').value);
  if(isNaN(v)||v<=0)return;
  S[selId].rad=v;
  const col=S[selId].custom?'stores_custom':'stores';
  dbUpdate(`${col}/${selId}`,{rad:v});
  render();toast(`📐 商圏半径を ${v}km に更新しました`);
}

/* 住所 → 緯度経度（国土地理院 住所検索API） */
async function geocodeInto(addrId,latId,lngId){
  const addr=(document.getElementById(addrId).value||'').trim().split(/\s/)[0]; // 建物名・階数は除く
  if(!addr){ toast('⚠ 住所を入力してください'); return; }
  try{
    const r=await fetch('https://msearch.gsi.go.jp/address-search/AddressSearch?q='+encodeURIComponent(addr));
    const j=await r.json();
    if(!j.length){ toast('⚠ 住所が見つかりませんでした'); return; }
    const[lng,lat]=j[0].geometry.coordinates;
    document.getElementById(latId).value=lat.toFixed(6);
    document.getElementById(lngId).value=lng.toFixed(6);
    if(latId==='ea-lat') map.flyTo([lat,lng],Math.max(map.getZoom(),16),{duration:.6});
    toast(`📍 位置を取得しました：${j[0].properties.title}`);
  }catch(e){ toast('⚠ 位置を取得できませんでした'); }
}

// 旧サイトの doc/collection 形式の API を Supabase の docs テーブルで再現する
function createSupabaseDb(){
  if(!sb) throw new Error('supabase-js not loaded');
  const fail=e=>{ toast('⚠ 保存できませんでした（権限がないか、通信エラーです）'); throw e; };
  const ok=({error})=>{ if(error) fail(error); };
  const split=path=>{ const i=path.indexOf('/'); return [path.slice(0,i), path.slice(i+1)]; };
  const upsert=(c,id,data)=>sb.from('docs')
    .upsert({collection:c,id,data,updated_at:new Date().toISOString()}).then(ok);
  const listeners=[];
  sb.channel('docs-changes')
    .on('postgres_changes',{event:'*',schema:'public',table:'docs'},p=>{
      const deleted=p.eventType==='DELETE';
      const row=deleted?p.old:p.new;
      if(!row?.collection) return;
      for(const fn of listeners) fn({collection:row.collection,id:row.id,data:deleted?null:row.data,deleted});
    })
    .subscribe();
  return {
    doc(path){
      const [c,id]=split(path);
      return {
        set:data=>upsert(c,id,data),
        async update(data){
          const {data:row,error}=await sb.from('docs').select('data')
            .eq('collection',c).eq('id',id).maybeSingle();
          if(error) fail(error);
          return upsert(c,id,{...(row?.data||{}),...data});
        },
        delete:()=>sb.from('docs').delete().eq('collection',c).eq('id',id).then(ok),
      };
    },
    collection(c){
      return {
        async get(){
          const {data,error}=await sb.from('docs').select('id,data').eq('collection',c);
          if(error) throw error;
          return {docs:data.map(r=>({id:r.id,exists:true,data:()=>r.data}))};
        },
      };
    },
    onChange(fn){ listeners.push(fn); },
  };
}

function applyStoreOverride(id,d){
  if(!d||!S[id]) return;
  if(typeof d.rad==='number') S[id].rad=d.rad;
  if(d.a!==undefined) S[id].a=d.a;
  if('lat' in d) S[id].lat=d.lat!=null?parseFloat(d.lat):null;
  if('lng' in d) S[id].lng=d.lng!=null?parseFloat(d.lng):null;
}
function applyCustomStore(id,d){
  if(!d||!d.n) return;
  S[id]={...d, id, custom:true,
    rad: typeof d.rad==='number'?d.rad:defR(d.ar||'市街地'),
    lat: d.lat!=null?parseFloat(d.lat):null,
    lng: d.lng!=null?parseFloat(d.lng):null};
}

/* ===== DB 初期化 & 起動 ===== */
(async()=>{
  // 店舗データはRAWから同期構築済みなので、DB読み込みを待たずに即座に初期描画する
  fitAll();
  render();

  try{
    db = createSupabaseDb();
    sb.auth.onAuthStateChange((_ev, session)=>{ setTimeout(()=>refreshAuth(session),0); });
    const { data:{ session } } = await sb.auth.getSession();
    const ownerCheck = refreshAuth(session, true);

    const dataLoad = Promise.all([
      db.collection('events').get(),
      db.collection('stores').get(),
      db.collection('stores_custom').get()
    ]).then(([evSnap, stSnap, csSnap])=>{
      const now = Date.now();
      for(const doc of evSnap.docs){
        const e = doc.data();
        if(e && e.exp > now) E[doc.id] = e;
      }
      for(const doc of stSnap.docs) applyStoreOverride(doc.id, doc.data());
      for(const doc of csSnap.docs) applyCustomStore(doc.id, doc.data());
    });

    await Promise.all([ownerCheck, dataLoad]);
    fitAll();
    render();

    // リアルタイム同期（他のユーザーの変更を即反映）
    db.onChange(({collection, id, data, deleted})=>{
      const now = Date.now();
      if(collection==='events'){
        if(deleted || !data || data.exp <= now) delete E[id];
        else E[id] = data;
      } else if(collection==='stores'){
        if(!deleted) applyStoreOverride(id, data);
      } else if(collection==='stores_custom'){
        if(deleted){ if(S[id]?.custom){ delete S[id]; if(selId===id) closeDetail(); } }
        else applyCustomStore(id, data);
      } else return;
      render();
    });
  }catch(e){
    console.error(e);
    db = null;
    toast('⚠ データベースに接続できませんでした');
    loadL();
    fitAll();
    render();
  }
})();
